<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sottovoce — prendersi cura, per fare le cose</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sottovoce</h1>
        <p>v1.0-beta</p>
    </header>

    <main>
        <section id="checkin">
    <h2>Come stai?</h2>
    <div class="checkin-buttons">
        <button class="checkin-btn" data-state="bene">✓ Sto bene, sono presente</button>
        <button class="checkin-btn" data-state="stanca">⏳ Sono stanca/o, ma ce la faccio</button>
        <button class="checkin-btn" data-state="agitata">⚡ Sono agitata/o, non riesco a fermarmi</button>
        <button class="checkin-btn" data-state="sopraffatta">💧 Sono sopraffatta/o</button>
        <button class="checkin-btn" data-state="spenta">● Sono spenta/o — non riesco a sentire niente</button>
    </div>
</section>

        <section id="tasks">
            <h2>Farò tutto piano piano</h2>
            <!-- Task manager va qui -->
        </section>
    </main>

    <footer>
        <p>© Nadia Bernava | <a href="https://nadiabernava.com">nadiabernava.com</a></p>
    </footer>
